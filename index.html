<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>t-calculator</title>

<!-- Bootstrap 5 (CDN) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="container">
  <!-- ================= Case Details ================= -->
  <div class="card shadow-sm mb-2">
    <div class="card-header fw-semibold">Case Details</div>
    <div class="card-body row g-2">
      <div class="col-12 col-md-6">
        <label for="agentType" class="form-label">Agent Type</label>
        <select id="agentType" class="form-select"></select>
      </div>
      <div class="col-12 col-md-6">
        <label for="liAge" class="form-label">Life Insured (LI) Age - In Year </label>
        <select id="liAge" class="form-select"></select>
        <div class="form-text" id="ageBandHint"></div>
      </div>
    </div>
  </div>

  <!-- ================= Current Application ================= -->
  <div class="card shadow-sm mb-2">
    <div class="card-header fw-semibold">Current Application</div>
    <div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-4">
          <label class="form-label">Product</label>
          <select class="form-select current-product"></select>
        </div>
        <div class="col-12 col-md-4">
          <label class="form-label">Face Amount (MMK)</label>
          <input type="text" inputmode="numeric" class="form-control currency-input current-face" placeholder="e.g. 50,000,000">
        </div>
        <div class="col-12 col-md-4">
          <label class="form-label d-block">TSAR</label>
          <span class="badge text-bg-light border w-100 current-tsar tsar-value">0 MMK</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= Concurrent Applications / Inforce Policies ================= -->
  <div class="card shadow-sm mb-2">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span class="fw-semibold">Concurrent Applications / Inforce Policies</span>
      <button type="button" class="btn btn-sm btn-outline-success" id="addConcurrentBtn">+Add</button>
    </div>
    <div class="card-body">
      <div id="concurrentList" class="d-flex flex-column gap-3">
        <!-- dynamic rows injected here -->
      </div>
      <p class="text-muted small mb-0 mt-2 d-none" id="noConcurrentMsg">No concurrent applications or inforce policies added.</p>
    </div>
  </div>

  <!-- ================= Summary / Result ================= -->
  <div class="card shadow border-0" id="summaryCard">
    <div class="card-body">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-md-6">
          <div class="text-muted small text-uppercase">TSAR Grand Total</div>
          <div class="fs-3 fw-bold" id="grandTsarValue">0 MMK</div>
        </div>
        <div class="col-12 col-md-6 text-md-end">
          <div class="text-muted small text-uppercase">Action</div>
          <span class="badge fs-5 px-3 py-2" id="finalActionBadge">—</span>
        </div>
      </div>
    </div>
  </div>

</main>

<!-- Concurrent entry row template (cloned via JS) -->
<template id="concurrentRowTemplate">
  <div class="row g-2 align-items-end concurrent-row border rounded-3 p-2 mx-0 mt-1">
    <div class="col-12 col-md-4">
      <label class="form-label">Product</label>
      <select class="form-select concurrent-product"></select>
    </div>
    <div class="col-12 col-md-4">
      <label class="form-label">Face Amount (MMK)</label>
      <input type="text" inputmode="numeric" class="form-control currency-input concurrent-face" placeholder="e.g. 20,000,000">
    </div>
    <div class="col-12 col-md-4">
      <label class="form-label d-block">TSAR</label>
      <span class="badge text-bg-light border w-100 concurrent-tsar tsar-value">0 MMK</span>
    </div>
    <div class="col-4 col-md-1 text-end">
      <button type="button" class="btn btn-sm btn-close btn-outline-danger remove-concurrent-btn" aria-label="Close"></button>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/calculator.js"></script>
<script src="js/main.js"></script>
</body>
</html>
